# Kenik - Netlify
[build]
  publish = "."

# Scripts en stijlen niet lang cachen: na elke push moet iedereen meteen de nieuwe versie krijgen.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
